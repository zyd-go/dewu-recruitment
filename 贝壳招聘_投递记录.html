<style>
:root{--accent:#27ae60;--ink:#202226;--muted:#8f969d;--line:#e8ebee;--bg:#f7f9f7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.header{height:72px;background:#ffffff;color:#222222;border-bottom:1px solid #eceef0;padding:0 52px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:11px;font-size:22px;font-weight:800}.mark{width:38px;height:38px;border-radius:10px;background:#27ae60;color:#fff;border:none;display:grid;place-items:center;font-size:12px;font-weight:900}
.nav{display:flex;gap:30px;font-size:14px;opacity:.78}.nav b{color:#27ae60;opacity:1}.user{font-size:13px;opacity:.62}
.hero{background:#f7f9f7;border-bottom:1px solid #eeeeee}.hero>div{max-width:1160px;margin:auto;padding:48px 24px 36px}.eyebrow{font-size:11px;letter-spacing:1.25px;color:var(--accent);font-weight:700;margin-bottom:8px}
.hero h1{font-size:36px;margin:0 0 9px}.hero p{margin:0;color:var(--muted)}
.wrap{max-width:1160px;margin:auto;padding:38px 24px 90px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.head h2{font-size:20px;margin:0}.head span{font-size:12px;color:#a0a6ac}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:29px 30px;display:grid;grid-template-columns:1fr 185px;gap:28px;align-items:center}
.job h3{font-size:25px;line-height:1.35;margin:10px 0 12px}.meta{font-size:14px;color:#747b82}.status{text-align:right}.status small{display:block;color:#a0a6ac;margin-bottom:6px}.status strong{font-size:17px;color:var(--accent)}
.note{margin-top:18px;padding-top:17px;border-top:1px solid #edf0f2;color:#969ca2;font-size:13px}.empty{text-align:center;color:#b9bec3;margin-top:34px;font-size:14px}.demo{position:fixed;right:14px;bottom:14px;color:#aaa;font-size:10px}
.status{border-left:1px solid #e6ebe7;padding-left:24px}
@media(max-width:720px){.header{padding:0 20px}.nav{display:none}.hero>div{padding:38px 20px}.wrap{padding:30px 18px}.card{grid-template-columns:1fr}.status{text-align:left;border-left:0;padding-left:0}.job h3{font-size:21px}}
</style>
</head>
